name: mssql
description: SQL Server client using Dart FFI and bundled FreeTDS for Windows, Linux and Android, with synchronous and asynchronous APIs and typed TLS configuration.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.3.0"


dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        pluginClass: MssqlConnectionPlugin
